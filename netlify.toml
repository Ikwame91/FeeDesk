# FeeDesk on Netlify (git-connected). See docs/DEPLOY.md for the click-by-click steps.
[build]
# Netlify DB (Neon) sets NETLIFY_DATABASE_URL; a Neon URL saved as DATABASE_URL works too.
# Production builds also run the database migrations.
command = "export DATABASE_URL=\"${NETLIFY_DATABASE_URL:-$DATABASE_URL}\" && NITRO_PRESET=netlify pnpm build && if [ \"${CONTEXT:-}\" = \"production\" ]; then pnpm migrate:production; fi"
publish = "dist"
functions = ".netlify/functions-internal"

[build.environment]
NITRO_PRESET = "netlify"
NPM_CONFIG_PRODUCTION = "false"
# Agent-Native needs Node.js 22.22+.
NODE_VERSION = "22"

[context.production.environment]
AGENT_NATIVE_DISABLE_KEEP_WARM_BACKGROUND = "1"
# Production release migrations own schema setup; request functions must skip
# migration probes on every serverless invocation.
AGENT_NATIVE_RELEASE_MIGRATIONS = "1"
# Sign-up is invite-only: only addresses in AUTH_BOOTSTRAP_ADMINS (set in the Netlify
# dashboard, not here) can create an account. There is no email provider, so email
# verification is off; that is safe only because sign-up is closed.
AUTH_SIGNUP = "invited"
AUTH_REQUIRE_EMAIL_VERIFICATION = "0"
